<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bastion{% endblock %} – Bastion</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {# No inline <script> or style="" anywhere: the secure build's CSP forbids them. #}
</head>
<body class="mode-{{ mode }}" data-auth="{{ 'true' if current_user else 'false' }}">

  <div class="mode-band" role="note">
    <div class="wrap mode-band__inner">
      {% if secure_mode %}
        <svg class="mode-band__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        <p><strong>Secure build.</strong> HTTPS, encrypted session, bcrypt, parameterized SQL, role checks and output escaping are on.</p>
      {% else %}
        <svg class="mode-band__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="1.5"/><path d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/></svg>
        <p><strong>Vulnerable build.</strong> Five weaknesses are switched on for the demo. Run it on your own machine only.</p>
      {% endif %}
      <a class="mode-band__link" href="{{ url_for('main.lab') }}">What to try</a>
    </div>
  </div>

  <header class="site-header wrap">
    <a class="brand" href="{{ url_for('main.index') }}">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 4.5 7v8.2c0 7 4.9 12.4 11.5 14.3 6.6-1.9 11.5-7.3 11.5-14.3V7z"/><path class="brand__mark-inner" d="M16 8.5v15M10.5 13h11"/></svg>
      Bastion
    </a>
    <nav class="site-nav" aria-label="Main">
      {% if current_user %}
        <a href="{{ url_for('main.dashboard') }}" {% if request.endpoint == 'main.dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
        {# Hiding the link is NOT access control - the server check in access.py is. #}
        {% if current_user.role == 'admin' %}
          <a href="{{ url_for('admin.panel') }}" {% if request.endpoint == 'admin.panel' %}aria-current="page"{% endif %}>Admin</a>
        {% endif %}
        <a href="{{ url_for('main.lab') }}" {% if request.endpoint == 'main.lab' %}aria-current="page"{% endif %}>Security lab</a>
        <form class="inline-form" method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="nav-button" type="submit">Sign out</button>
        </form>
      {% else %}
        <a href="{{ url_for('main.lab') }}" {% if request.endpoint == 'main.lab' %}aria-current="page"{% endif %}>Security lab</a>
        <a href="{{ url_for('auth.login') }}" {% if request.endpoint == 'auth.login' %}aria-current="page"{% endif %}>Sign in</a>
        <a class="button button--small" href="{{ url_for('auth.register') }}">Create account</a>
      {% endif %}
    </nav>
  </header>

  <main class="wrap site-main" id="main">
    {% with flashes = get_flashed_messages(with_categories=true) %}
      {% set ns = namespace(has_notice=false) %}
      {% for category, message in flashes %}{% if not category.startswith('sql') %}{% set ns.has_notice = true %}{% endif %}{% endfor %}
      {% if ns.has_notice %}
        <div class="notices" role="status">
          {% for category, message in flashes if not category.startswith('sql') %}
            <p class="notice notice--{{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}

      {% for category, message in flashes if category.startswith('sql') %}
        <details class="inspector inspector--{{ 'unsafe' if category == 'sql-unsafe' else 'safe' }}" {% if loop.first %}open{% endif %}>
          <summary>
            <span class="inspector__title">SQL inspector</span>
            <span class="inspector__verdict">
              {% if category == 'sql-unsafe' %}Your input was pasted into the SQL text
              {% else %}Parameterized: your input never touched the SQL text{% endif %}
            </span>
          </summary>
          <pre><code>{{ message }}</code></pre>
        </details>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="wrap site-footer">
    <p>Bastion is a coursework project for demonstrating web vulnerabilities and their fixes.
      You're running the <strong>{{ mode }}</strong> build.
      Start the other one with <code>python run.py --mode {{ 'vulnerable' if secure_mode else 'secure' }}</code>.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
